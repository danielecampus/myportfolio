  chiara:
    horizon:       35
    initial_value: 15000
    monthly_cf:    800
    exclude_from_universe:
      - "MSCI World"
      - "MSCI All Country"
    assets:
      - "World Momentum"
      - "World Low Volatility"
      - "EU Gov bonds 7-10y"
      - "EU Overnight"
      - "US Short Treasury"
      - "ETC GOLD"
